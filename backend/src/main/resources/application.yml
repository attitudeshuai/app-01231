server:
  port: 9999
  servlet:
    context-path: /api

spring:
  application:
    name: library-management-system
  
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:library_db}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root123456}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      auto-commit: true
      idle-timeout: 30000
      pool-name: LibraryHikariCP
      max-lifetime: 1800000
      connection-timeout: 30000
  
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.library.module.*.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    cache-enabled: false

# JWT配置
jwt:
  secret: ${JWT_SECRET:LibraryManagementSystemSecretKey2024VeryLongSecretKeyForSecurity}
  expiration: 86400000  # 24小时
  refresh-expiration: 604800000  # 7天
  header: Authorization
  prefix: "Bearer "

# 文件上传配置
file:
  upload:
    path: ${FILE_UPLOAD_PATH:/app/uploads}
    allowed-types: jpg,jpeg,png,gif,webp
    max-size: 5242880  # 5MB

# 系统配置
library:
  default-borrow-days: 30
  max-renew-times: 1
  renew-days: 30
  overdue-fine-per-day: 0.5
  stock-warning-threshold: 5
  # 邮件提醒配置
  reminder:
    enabled: ${REMINDER_ENABLED:true}
    days-before: ${REMINDER_DAYS:3}
    cron: "0 0 8 * * ?"  # 每天早上8点
  # 逾期通知配置
  overdue:
    cron: "0 0 9 * * ?"  # 每天早上9点
  # 数据备份配置
  backup:
    enabled: ${BACKUP_ENABLED:true}
    path: ${BACKUP_PATH:/app/backups}
    cron: "0 0 2 * * ?"  # 每天凌晨2点
    keep-days: 7  # 保留7天的备份

# 日志配置
logging:
  level:
    root: INFO
    com.library: DEBUG
    com.library.module: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Swagger配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
